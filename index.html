<!DOCTYPE html>
<html lang="en">
<head>
   <META CHARSET ="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doubly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="person-selector">
        <button class="button person-selector-button active-person" id="johns chat">john</button>
        <button class="button person-selector-button" id="janes chat">jane</button>
    </div>
   <div class="chat-container">
        <h2 class="chat-header">John chatting...</h2>
        <div class="chat-messages">
            <div class="messages blue-bg">
                <div class="message-sender">John</div>
                <div class="message-text">Hello, how are you?</div>
                <div class="message-time">10:00 AM</div>
            </div>
            <div class="messages grey-bg">
                <div class="message-sender">Jane</div>
                <div class="message-text">I'm good, thanks! How about you?</div>
                <div class="message-time">10:01 AM</div>
            </div>
        </div>
        <form class="chat-input-form">
            <input type="text" class="chat-input" required placeholder="Type here, John...">
            <button type="submit" class="button send-button">Send</button>
        </form>
        <button class="button clear-chat-button">Clear chat</button>
   </div>
   <script src="temp.js"></script>
</body>
</html>
